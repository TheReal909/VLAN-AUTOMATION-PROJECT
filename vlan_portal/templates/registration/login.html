{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
  <h2>Sign in</h2>
  {% if form.errors %}
    <p role="alert">Your username and password did not match.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
